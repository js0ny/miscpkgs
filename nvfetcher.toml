[chatgpt]
src.cmd = "tmp=$(mktemp); trap 'rm -f $tmp' EXIT; curl -fsSL -r 0-65535 https://persistent.oaistatic.com/codex-app-prod/linux/deb/latest/chatgpt_amd64.deb -o $tmp; ar p $tmp control.tar.xz | tar -xO --xz ./control | sed -n 's/^Version: //p'"
fetch.url = "https://persistent.oaistatic.com/codex-app-prod/linux/deb/latest/chatgpt_amd64.deb"

