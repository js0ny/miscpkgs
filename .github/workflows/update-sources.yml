name: Update sources

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: write

jobs:
  update:
    name: Update nixpkgs and nvfetcher sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17

      - name: Update nixpkgs
        run: nix flake update nixpkgs

      - name: Update nvfetcher sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nix run nixpkgs#nvfetcher -- -c nvfetcher.toml -o _sources

      - name: Create commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update nix sources"
          git push
